name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      # Until a custom domain is set, GitHub Pages serves the site under /<repository>/,
      # so every internal link must work under a base path too.
      - name: Check the links under a base path
        env:
          PAGES_URL: https://example.github.io/img-website
        run: npx astro build && node scripts/check-links.mjs
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist
          retention-days: 7
