name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC, to pick up new Zenodo records.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Check that the site is ready to go live
        run: node scripts/check-launch.mjs
      - name: Update Zenodo records
        run: node scripts/sync-zenodo.mjs
      - uses: withastro/action@v6
        with:
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
